<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灵影 Live · 人物生成片段</title>
  <meta name="description" content="观看灵影 Live 已有 Pro 人物生成片段。该片段不是整轮连续对话录屏。">
  <style>
    :root{color-scheme:dark;--bg:#10131c;--text:#eff2fa;--muted:#a9b0c1;--accent:#91a4ff;--line:#2a3145}*{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}a{color:inherit;text-underline-offset:5px;transition:color .18s}a:hover{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    nav{display:flex;justify-content:space-between;gap:20px;padding:22px 5vw;border-bottom:1px solid var(--line)}nav strong{letter-spacing:.04em}nav a{font-size:14px;color:var(--muted)}.muted,small{color:var(--muted)}
    main{max-width:1120px;margin:auto;padding:42px 5vw 65px}.intro{animation:enter .45s ease-out}h1{font-size:clamp(28px,5vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.3;margin:8px 0 10px}.intro p{max-width:680px;color:var(--muted);margin:0 0 28px}
    .view{display:grid;grid-template-columns:minmax(250px,512px) 1fr;gap:45px;align-items:center;animation:enter .6s ease-out}video{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#000}.description h2{font-size:24px;line-height:1.4;margin:0 0 18px}.description p{color:var(--muted);margin:0 0 16px}.description a{display:inline-block;color:var(--accent);margin-top:8px}footer{border-top:1px solid var(--line);margin-top:36px;padding-top:22px;color:var(--muted);font-size:13px}.failure{color:var(--muted);font-size:14px}[hidden]{display:none!important}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:720px){.view{grid-template-columns:1fr;gap:24px}video{max-width:512px;margin:auto}nav{padding:18px 5vw}.description h2{font-size:21px}}
  </style>
</head>
<body>
  <nav><strong>灵影 Live <span class="muted">/ VivaPersona Live</span></strong><a href="https://github.com/jiangfeibo/VivaPersona-Live">返回文章 ↗</a></nav>
  <main>
    <header class="intro"><small>真实生成输出 · 含音轨</small><h1>看见人物讲述。</h1><p>这是已有 Pro 模型生成的短片段。点击播放可聆听声音，也可使用全屏观看。</p></header>
    <div class="view"><video id="player" controls playsinline preload="metadata" poster="media/pro-output-poster.png" src="media/pro-output-example.mp4" aria-label="真实 Pro 人物生成片段"></video><section class="description"><h2>约 2.8 秒的人物片段</h2><p>512 × 512 · H.264 / AAC<br>展示已有的人物画面与声音输出。</p><p>该次历史请求记录耗时约 61.5 秒。这是单次人物生成记录，不是稳定延迟指标，也不是“输入—回答—配音—人物播放”的整轮录屏。</p><a href="media/pro-output-example.mp4" download>下载原始片段 ↓</a></section></div>
    <p id="error" class="failure" role="status" hidden>视频暂时无法加载，可以下载原始片段后观看。</p>
    <footer>完整连续交互演示尚待补充。当前片段来自项目已有测试输出，不代表摄像头、插话、回声或多轮使用已完成验收。</footer>
  </main>
  <script>document.getElementById('player').addEventListener('error',()=>{document.getElementById('error').hidden=false});</script>
</body>
</html>
